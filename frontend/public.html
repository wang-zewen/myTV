<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamVault 影视</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f7fb;--s1:#ffffff;--s2:#f8fafc;--s3:#eef2f7;--s4:#e2e8f0;
  --fg:#0f172a;--fg2:#334155;--dim:#64748b;--border:#dbe3ef;
  --acc:#6366f1;--acc2:#8b5cf6;--acc-g:linear-gradient(135deg,#6366f1,#8b5cf6);
  --r:13px;--rsm:9px;
}
body{background:
  radial-gradient(circle at top, rgba(99,102,241,.10), transparent 32%),
  radial-gradient(circle at 12% 0%, rgba(139,92,246,.08), transparent 18%),
  linear-gradient(180deg, #f8fbff 0%, #f5f7fb 100%);
color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',sans-serif;min-height:100vh;overflow-x:hidden;}
button{cursor:pointer;font-family:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:2px;}

/* ── header ── */
.hd{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(99,102,241,.06);}
.hd-inner{display:flex;align-items:center;gap:14px;max-width:1440px;margin:0 auto;padding:12px 24px;}
.logo{font-size:19px;font-weight:900;letter-spacing:-.5px;white-space:nowrap;background:linear-gradient(120deg,#6366f1,#8b5cf6 55%,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;display:inline-flex;align-items:baseline;}
.logo-sub{-webkit-text-fill-color:var(--dim);font-size:12px;font-weight:400;margin-left:5px;filter:none;}
.search-wrap{flex:1;max-width:560px;display:flex;align-items:center;background:var(--s2);border:1px solid var(--border);border-radius:11px;transition:border-color .2s,box-shadow .2s;}
.search-wrap:focus-within{border-color:rgba(99,102,241,.48);box-shadow:0 0 0 3px rgba(99,102,241,.07);}
.search-input{flex:1;background:none;border:none;outline:none;padding:10px 16px;color:var(--fg);font-size:14px;}
.search-input::placeholder{color:var(--dim);}
.search-btn{background:none;border:none;border-left:1px solid var(--border);padding:9px 16px;color:var(--dim);font-size:14px;transition:color .15s;border-radius:0 11px 11px 0;}
.search-btn:hover{color:var(--acc);}
.admin-btn{background:var(--s2);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 15px;font-size:12px;font-weight:600;color:var(--fg2);text-decoration:none;white-space:nowrap;transition:.18s;letter-spacing:.02em;}
.admin-btn:hover{color:var(--fg);border-color:rgba(99,102,241,.38);background:var(--s3);}
@media(max-width:500px){.admin-btn{display:none;}}

/* ── source tabs ── */
.src-nav{background:var(--s1);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;padding:0 24px;gap:2px;}
.src-nav::-webkit-scrollbar{display:none;}
.stab{background:none;border:none;border-bottom:2px solid transparent;padding:13px 18px;font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap;transition:.18s;display:flex;align-items:center;gap:7px;}
.stab.on{color:var(--acc2);border-bottom-color:var(--acc);}
.stab:hover:not(.on){color:var(--fg);background:rgba(99,102,241,.06);}
.stab .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:.18s;}
.stab.on .dot{background:var(--acc);box-shadow:0 0 6px rgba(124,111,255,.55);}

/* ── category bar ── */
.cat-outer{background:var(--s1);border-bottom:1px solid var(--border);}
.cat-bar{display:flex;overflow-x:auto;gap:8px;padding:11px 24px;scrollbar-width:none;max-width:1440px;margin:0 auto;}
.cat-bar::-webkit-scrollbar{display:none;}
.ctab{background:var(--s3);border:1px solid var(--border);border-radius:20px;padding:5px 16px;font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap;transition:.18s;}
.ctab.on{background:var(--acc-g);color:#fff;border-color:transparent;box-shadow:0 2px 12px rgba(124,111,255,.26);}
.ctab:hover:not(.on){color:var(--fg);border-color:rgba(124,111,255,.32);background:rgba(124,111,255,.07);}

/* ── main ── */
.main{max-width:1440px;margin:0 auto;padding:22px 24px 80px;}
@media(max-width:600px){.main{padding:16px 14px 60px;}}

/* section header */
.sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.sec-title{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.sec-title::before{content:'';display:inline-block;width:3px;height:14px;background:var(--acc-g);border-radius:2px;box-shadow:0 0 8px rgba(124,111,255,.4);}
.sec-count{font-size:11px;color:var(--dim);background:var(--s3);border:1px solid var(--border);padding:2px 9px;border-radius:10px;}
.search-info{font-size:13px;color:var(--dim);margin-bottom:18px;padding:11px 16px;background:var(--s2);border:1px solid var(--border);border-radius:10px;}
.search-info strong{color:var(--fg2);}

/* ── grid ── */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
@media(min-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(162px,1fr));}}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(auto-fill,minmax(188px,1fr));}}

/* ── card ── */
.vc{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .26s cubic-bezier(.34,1.4,.64,1),border-color .2s,box-shadow .26s;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.vc:hover{transform:translateY(-6px) scale(1.016);border-color:rgba(99,102,241,.38);box-shadow:0 14px 36px rgba(0,0,0,.12),0 0 0 1px rgba(99,102,241,.1);}
.vc-thumb{aspect-ratio:2/3;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.vc-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease;}
.vc:hover .vc-thumb img{transform:scale(1.06);}
.vc-thumb-icon{position:absolute;font-size:36px;opacity:.45;pointer-events:none;}
.vc-tag{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;letter-spacing:.04em;}
.vc-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,rgba(0,0,0,.08) 55%,transparent 100%);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .22s;}
.vc:hover .vc-overlay{opacity:1;}
.play-circle{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,rgba(124,111,255,.96),rgba(180,140,255,.96));display:flex;align-items:center;justify-content:center;font-size:18px;transform:scale(.72) translateY(6px);transition:transform .28s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 24px rgba(124,111,255,.55);}
.vc:hover .play-circle{transform:scale(1) translateY(0);}
.vc-body{padding:10px 12px 13px;}
.vc-name{font-size:13px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vc-sub{font-size:11px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vc-badge{display:inline-flex;align-items:center;font-size:10px;color:var(--acc2);background:rgba(124,111,255,.07);border:1px solid rgba(124,111,255,.17);border-radius:4px;padding:2px 7px;margin-top:5px;font-weight:600;}

/* ── skeleton ── */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.sk-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.sk-thumb{aspect-ratio:2/3;}
.sk-line{height:10px;border-radius:4px;margin:10px 12px 0;}
.sk-line.w70{width:70%;}
.sk-line.w45{width:45%;margin-bottom:13px;}
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200% 100%;animation:shimmer 1.6s infinite;}

/* ── more ── */
.more-wrap{text-align:center;padding:40px 0 0;}
.more-btn{background:var(--s2);border:1px solid rgba(124,111,255,.18);color:var(--fg2);border-radius:var(--r);padding:11px 40px;font-size:13px;font-weight:600;transition:.2s;letter-spacing:.02em;}
.more-btn:hover{border-color:rgba(124,111,255,.44);color:var(--fg);box-shadow:0 4px 20px rgba(124,111,255,.1);background:var(--s3);}

/* ── empty ── */
.empty{text-align:center;padding:80px 24px;color:var(--dim);grid-column:1/-1;}
.empty-icon{font-size:56px;display:block;margin-bottom:16px;}
.empty-h{font-size:16px;font-weight:700;color:var(--fg2);margin-bottom:8px;}
.empty-p{font-size:13px;line-height:1.7;max-width:260px;margin:0 auto;}

/* ── detail view ── */
.dv{display:none;}
.dv-nav{display:flex;align-items:center;gap:12px;padding:16px 0 20px;}
.back-btn{background:var(--s2);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 16px;font-size:13px;font-weight:600;color:var(--fg2);display:flex;align-items:center;gap:6px;transition:.18s;}
.back-btn:hover{color:var(--fg);border-color:rgba(99,102,241,.38);background:var(--s3);}
.dv-crumb{font-size:12px;color:var(--dim);font-weight:500;background:var(--s2);border:1px solid var(--border);padding:4px 10px;border-radius:6px;}
.player-box{background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;position:relative;box-shadow:0 0 0 1px var(--border),0 16px 48px rgba(0,0,0,.18);}
.player-box video{width:100%;height:100%;display:block;}
.player-err{position:absolute;inset:0;background:rgba(15,23,42,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#cbd5e1;font-size:14px;}
.dv-body{padding:20px 0 8px;}
.dv-title{font-size:22px;font-weight:800;line-height:1.25;margin-bottom:10px;letter-spacing:-.3px;}
.dv-meta{font-size:12px;color:var(--fg2);line-height:2.1;}
.dv-desc{font-size:13px;color:var(--dim);line-height:1.85;margin-top:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.ep-section{margin-top:22px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;}
.ep-hd{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.ep-label{font-size:11px;font-weight:700;color:var(--fg2);letter-spacing:.07em;text-transform:uppercase;}
.ep-total{font-size:11px;color:var(--dim);background:var(--s3);border:1px solid var(--border);padding:2px 8px;border-radius:8px;}
.ep-grid{display:flex;flex-wrap:wrap;gap:8px;max-height:220px;overflow-y:auto;padding-right:4px;}
.ep{background:var(--s3);border:1px solid var(--border);border-radius:var(--rsm);padding:7px 15px;font-size:12px;color:var(--fg2);transition:.18s;min-width:56px;text-align:center;font-weight:500;}
.ep.on{background:var(--acc-g);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 3px 12px rgba(124,111,255,.32);}
.ep:hover:not(.on){color:var(--fg);border-color:rgba(124,111,255,.36);background:rgba(124,111,255,.07);}
.meta-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
.meta-chip{background:var(--s3);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--fg2);cursor:pointer;transition:.18s;font-weight:500;white-space:nowrap;}
.meta-chip:hover{color:var(--fg);border-color:rgba(124,111,255,.4);background:rgba(124,111,255,.08);}
.meta-chip-label{font-size:10px;font-weight:700;color:var(--acc2);margin-right:3px;}
</style>
</head>
<body>

<!-- Emby 密码弹窗 -->
<style>
.emby-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;}
.emby-box{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.emby-icon{font-size:34px;margin-bottom:12px;line-height:1;}
.emby-title{font-size:17px;font-weight:800;margin-bottom:5px;letter-spacing:-.2px;}
.emby-desc{font-size:13px;color:var(--dim);margin-bottom:20px;line-height:1.5;}
.emby-input{width:100%;background:var(--s3);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--fg);font-size:14px;outline:none;margin-bottom:11px;transition:border-color .2s;}
.emby-input:focus{border-color:rgba(124,111,255,.45);}
.emby-submit{width:100%;padding:11px;background:var(--acc-g);border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:9px;transition:filter .15s;box-shadow:0 4px 16px rgba(124,111,255,.3);}
.emby-submit:hover{filter:brightness(1.1);}
.emby-err{color:#f87171;font-size:12px;min-height:16px;margin-bottom:8px;}
.emby-cancel{width:100%;padding:9px;background:none;border:1px solid var(--border);border-radius:9px;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
.emby-cancel:hover{color:var(--fg);border-color:var(--s4);}
</style>
<div id="embyAuthOverlay" class="emby-overlay">
  <div class="emby-box">
    <div class="emby-icon">🔐</div>
    <div class="emby-title">Emby 访问</div>
    <div class="emby-desc">请输入 Emby 访问密码</div>
    <input id="embyPwdInput" type="password" class="emby-input" placeholder="密码">
    <button id="embyPwdBtn" class="emby-submit">进入</button>
    <div id="embyPwdErr" class="emby-err"></div>
    <button class="emby-cancel" onclick="$('embyAuthOverlay').style.display='none'">取消</button>
  </div>
</div>

<header class="hd">
  <div class="hd-inner">
    <a class="logo" href="/">StreamVault<span class="logo-sub">影视</span></a>
    <div class="search-wrap">
      <input class="search-input" id="q" placeholder="聚合搜索所有接口..." autocomplete="off">
      <button class="search-btn" onclick="doSearch()">🔍</button>
    </div>
    <a href="/admin" class="admin-btn">管理 →</a>
  </div>
</header>

<nav class="src-nav" id="srcBar"></nav>
<div class="cat-outer" id="catOuter" style="display:none"><div class="cat-bar" id="catBar"></div></div>

<div class="main">
  <div id="browseView">
    <div id="secHd"></div>
    <div class="grid" id="grid"></div>
    <div class="more-wrap" id="moreWrap" style="display:none">
      <button class="more-btn" onclick="loadMore()">加载更多</button>
    </div>
  </div>

  <div class="dv" id="detailView">
    <div class="dv-nav">
      <button class="back-btn" onclick="goBack()">← 返回</button>
      <span class="dv-crumb" id="dvCrumb"></span>
    </div>
    <div class="player-box">
      <video id="player" controls playsinline></video>
      <button id="centerPlayBtn" class="center-play-btn hidden" onclick="playCurrentVideo()">▶</button>
      <div id="playerLoading" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(255,255,255,.72);color:var(--fg2);font-size:13px;z-index:2;">
        <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--acc2);border-radius:50%;animation:spin 1s linear infinite;"></div>
        <span id="playerLoadingText">正在加载播放...</span>
      </div>
      <div class="player-err" id="playerErr"><span style="font-size:36px">⚠️</span><span id="playerErrMsg">播放失败</span></div>
    </div>
    <div class="player-actions-row">
      <button id="primaryPlayBtn" class="secondary-play-btn" onclick="playCurrentVideo()">▶ 播放</button>
      <button id="prevVideoBtn" class="nav-video-btn" onclick="playAdjacentVideo(-1)">← 上一个</button>
      <button id="nextVideoBtn" class="nav-video-btn" onclick="playAdjacentVideo(1)">下一个 →</button>
    </div>
    <div class="dv-body">
      <div class="dv-title" id="dvTitle"></div>
      <div class="dv-meta" id="dvMeta"></div>
      <div class="dv-desc" id="dvDesc"></div>
    </div>
    <div class="ep-section" id="epSection">
      <div class="ep-hd"><span class="ep-label">选集</span><span class="ep-total" id="epTotal"></span></div>
      <div class="ep-grid" id="epGrid"></div>
    </div>
    <!-- Emby 电影播放按钮 -->
    <div id="embyActions" style="display:none;margin-top:20px;">
      <button id="embyDirectBtn" style="padding:11px 32px;background:var(--acc-g);border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 18px rgba(124,111,255,.35);transition:filter .15s;" onmouseover="this.style.filter='brightness(1.1)'" onmouseout="this.style.filter=''">▶ 播放</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const LOCAL='__local__';
const EMBY='__emby__';
let sources=[], curSrc='', curCat=0, page=1, pageCount=1, hasCats=false;
let isSearch=false, isLocal=false, isEmby=false;
let vodArr=[], epArr=[], hlsInst=null;
let embyStatus={configured:false,need_auth:false};
let _playerReadyBound=false;
let embyLibraries=[], curEmbyLib='', embyPage=1, embyTotal=0;
let curEmbyItem=null;
let curEmbyPerson=null;
let _embyBrowseRestore=null;
let _embyCurPeople=[];
let _browseScrollY=0;
let _currentPlayable=null;
let _currentPlayableIndex=-1;

// ── init ──────────────────────────────────────────────────────
async function init(){
  try{const r=await fetch('/api/sources');sources=(await r.json()).filter(s=>s.enabled!==false);}catch(e){sources=[];}
  try{const r=await fetch('/api/emby/status');embyStatus=await r.json();}catch(e){embyStatus={configured:false,need_auth:false};}
  renderSrcBar();
  await selectLocal(); // 默认打开本地库
}

// ── source bar ─────────────────────────────────────────────────
function renderSrcBar(){
  const localBtn=`<button class="stab${curSrc===LOCAL?' on':''}" onclick="selectLocal()"><span>📼</span>本地视频库</button>`;
  const srcBtns=sources.map((s,i)=>`<button class="stab${curSrc===s.url?' on':''}" onclick="selectSrc(${i})"><span class="dot"></span>${esc(s.name)}</button>`).join('');
  const embyBtn=embyStatus.configured?`<button class="stab${curSrc===EMBY?' on':''}" onclick="selectEmby()"><span>🖥</span>Emby</button>`:'';
  $('srcBar').innerHTML=localBtn+srcBtns+embyBtn;
}

// ── local videos ───────────────────────────────────────────────
async function selectLocal(){
  curSrc=LOCAL; isLocal=true; isSearch=false; _setCurrentPlayable(null,-1);
  $('q').value='';
  renderSrcBar();
  $('catOuter').style.display='none';
  showBrowse();
  setGrid(skelHtml(8));
  $('secHd').innerHTML='';
  try{
    const r=await fetch('/api/videos');
    const list=await r.json();
    vodArr=list.map(v=>({...v,__local:true}));
    if(!vodArr.length){setGrid(emptyHtml('📭','本地视频库为空','在管理界面下载视频后将在此显示'));return;}
    $('secHd').innerHTML=secHdHtml('本地视频库',vodArr.length+'个视频');
    $('grid').innerHTML=vodArr.map((v,i)=>localCard(v,i)).join('');
  }catch(e){setGrid(emptyHtml('⚠️','加载失败', e && e.message ? e.message : 'Emby 分类加载失败'));}
}


function localCard(v,i){
  const hue=hash(v.name)%360;
  const date=new Date(v.created_at).toLocaleDateString('zh-CN');
  return `<div class="vc" onclick="openDetail(${i})">
    <div class="vc-thumb" style="background:linear-gradient(145deg,hsl(${hue},35%,78%),hsl(${(hue+50)%360},28%,68%))">
      <div class="vc-thumb-icon">🎬</div>
      <div class="vc-overlay"><div class="play-circle">▶</div></div>
    </div>
    <div class="vc-body">
      <div class="vc-name">${esc(v.name)}</div>
      <div class="vc-sub">${v.size_mb} MB · ${date}</div>
    </div>
  </div>`;
}

// ── CMS source ─────────────────────────────────────────────────
async function selectSrc(idx){
  curSrc=sources[idx].url; curCat=0; page=1; isSearch=false; isLocal=false; _setCurrentPlayable(null,-1);
  $('q').value='';
  renderSrcBar();
  showBrowse();
  setGrid(skelHtml(12));
  $('catBar').innerHTML='';
  await fetchCatalog(curSrc,0,1,true);
}

async function fetchCatalog(srcUrl,typeId,pg,resetCats){
  const p=new URLSearchParams({source_url:srcUrl,ac:'list',pg});
  if(typeId) p.set('t',typeId);
  try{
    const r=await fetch('/api/catalog?'+p);
    const d=await r.json();
    page=pg;
    pageCount=d.pagecount||1;
    if(resetCats){
      const cats=d.class||[];
      hasCats=cats.length>0;
      $('catOuter').style.display=hasCats?'block':'none';
      renderCatBar(cats);
    }
    const list=d.list||[];
    vodArr=list;
    $('secHd').innerHTML=list.length?secHdHtml(sources.find(s=>s.url===srcUrl)?.name||'',`第 ${page} / ${pageCount} 页`):'' ;
    renderGrid(list,true,false);
    renderPager(page,pageCount,'gotoCatalogPage');
    window.scrollTo({top:0,behavior:'auto'});
  }catch(e){setGrid(emptyHtml('⚠️','加载失败','请检查接口是否可用'));}
}

async function gotoCatalogPage(pg){
  if(pg<1||pg>pageCount||isSearch||isLocal)return;
  await fetchCatalog(curSrc,curCat,pg,false);
}

async function openDetail(idx){
  const v=vodArr[idx];if(!v)return;
  if(v.__emby){
    $('embyActions').style.display='none';
    _currentPlayableIndex=idx;
    await openEmbyDetail(v);
    return;
  }
  if(v.__local){
    _clearPeopleChips();
    showDetail();
    $('dvCrumb').textContent='本地视频库';
    $('dvTitle').textContent=v.name;
    $('dvMeta').textContent=`${v.size_mb} MB · ${new Date(v.created_at).toLocaleString('zh-CN')}`;
    $('dvDesc').textContent='';
    $('epSection').style.display='none';
    stopPlayer();
    _setCurrentPlayable({kind:'local',url:v.url}, idx);
    startPlay($('player'),v.url);
    return;
  }
  const srcUrl=v.source_url||curSrc;
  _clearPeopleChips();
  showDetail();
  $('dvCrumb').textContent=sources.find(s=>s.url===srcUrl)?.name||'';
  $('dvTitle').textContent=v.vod_name;
  $('dvMeta').textContent='加载中...';
  $('dvDesc').textContent='';
  $('epGrid').innerHTML='';
  $('epSection').style.display='block';
  $('epTotal').textContent='';
  stopPlayer();
  try{
    const r=await fetch('/api/catalog?'+new URLSearchParams({source_url:srcUrl,ac:'detail',ids:v.vod_id}));
    const d=await r.json();
    const vod=(d.list||[])[0];
    if(!vod){$('dvMeta').textContent='获取详情失败';return;}
    $('dvTitle').textContent=vod.vod_name;
    $('dvMeta').textContent=[vod.vod_year,vod.type_name,vod.vod_area,
      vod.vod_director?'导演：'+vod.vod_director:'',
      vod.vod_actor?'主演：'+vod.vod_actor.split(',').slice(0,4).join('、'):'',
    ].filter(Boolean).join('  ·  ');
    if(vod.vod_content) $('dvDesc').textContent=vod.vod_content.replace(/<[^>]+>/g,'').trim();
    epArr=parseEps(vod.vod_play_from||'',vod.vod_play_url||'');
    $('epTotal').textContent=epArr.length?epArr.length+'集':'';
    $('epGrid').innerHTML=epArr.length
      ?epArr.map((e,i)=>`<button class="ep" id="ep${i}" onclick="playEp(${i})">${esc(e.name)}</button>`).join('')
      :'<span style="color:var(--dim);font-size:12px">暂无剧集信息</span>';
    if(epArr.length){ _setCurrentPlayable({kind:'cms-episode',index:0}, idx); playEp(0); } else { _setCurrentPlayable(null, idx); }
  }catch(e){$('dvMeta').textContent='加载失败';}
}

function parseEps(f,u){
  if(!u)return[];
  const g=u.split('$$$'),best=g.find(x=>/https?:\/\//i.test(x))||g[0]||'';
  return best.split('#').map((s,i)=>{
    s=s.trim();if(!s)return null;
    const d=s.indexOf('$'),name=d>=0?s.slice(0,d).trim():`P${i+1}`,url=d>=0?s.slice(d+1).trim():s;
    return /https?:\/\//i.test(url)?{name,url}:null;
  }).filter(Boolean);
}

function playEp(idx){
  document.querySelectorAll('.ep').forEach((b,i)=>b.classList.toggle('on',i===idx));
  const ep=epArr[idx];if(!ep)return;
  _setCurrentPlayable({kind:'cms-episode',index:idx}, _currentPlayableIndex);
  startPlay($('player'),ep.url);
  document.getElementById('ep'+idx)?.scrollIntoView({block:'nearest',inline:'center'});
}

function showPlayerLoading(text='正在加载播放...'){
  $('playerLoadingText').textContent=text;
  $('playerLoading').style.display='flex';
}
function hidePlayerLoading(){$('playerLoading').style.display='none';}
function showPlayerError(msg){
  hidePlayerLoading();
  $('playerErrMsg').textContent=msg;
  $('playerErr').style.display='flex';
}
function _bindPlayerReady(video){
  if(_playerReadyBound)return;
  _playerReadyBound=true;
  ['loadeddata','canplay'].forEach(ev=>video.addEventListener(ev,hidePlayerLoading));
  video.addEventListener('playing',()=>{hidePlayerLoading();updateCenterPlayOverlay(false);});
  video.addEventListener('pause',()=>{ if(_currentPlayable && !video.ended) updateCenterPlayOverlay(true); });
  video.addEventListener('ended',()=>{ if(_currentPlayable) updateCenterPlayOverlay(true); });
  video.addEventListener('waiting',()=>showPlayerLoading('缓冲中...'));
  video.addEventListener('stalled',()=>showPlayerLoading('网络较慢，正在重试...'));
  video.addEventListener('error',()=>showPlayerError('视频播放失败，链接可能已失效或格式不兼容'));
}
function startPlay(video,url){
  stopPlayer();
  _bindPlayerReady(video);
  $('playerErr').style.display='none';
  updateCenterPlayOverlay(false);
  showPlayerLoading('正在加载播放...');
  const isM3u8=/\.m3u8/i.test(url);
  if(isM3u8&&typeof Hls!=='undefined'&&Hls.isSupported()){
    let mediaErrCount=0;
    hlsInst=new Hls({enableWorker:true,maxBufferLength:30});
    hlsInst.loadSource(url);
    hlsInst.attachMedia(video);
    hlsInst.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
    hlsInst.on(Hls.Events.ERROR,(_,d)=>{
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){
        showPlayerLoading('网络波动，正在重连...');
        hlsInst.startLoad();
      }else if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&mediaErrCount<2){
        mediaErrCount++;
        showPlayerLoading('正在恢复播放...');
        hlsInst.recoverMediaError();
      }else{
        const msg=d.type===Hls.ErrorTypes.NETWORK_ERROR?'网络错误，源不可用':'媒体解码失败，格式不兼容';
        showPlayerError(msg);
      }
    });
  }else if(isM3u8&&video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;
    video.play().catch(()=>showPlayerError('播放启动失败，请稍后重试'));
  }else{
    video.src=url;
    video.play().catch(()=>showPlayerError('播放启动失败，请稍后重试'));
  }
}

function stopPlayer(){
  if(hlsInst){hlsInst.destroy();hlsInst=null;}
  hidePlayerLoading();
  $('playerErr').style.display='none';
  const v=$('player');v.pause();v.removeAttribute('src');v.load();
  updateCenterPlayOverlay(!!_currentPlayable);
}

function goBack(){
  stopPlayer();
  $('embyActions').style.display='none';
  $('detailView').style.display='none';
  $('browseView').style.display='block';
  if(isEmby && curEmbyPerson && _restoreEmbyBrowseAfterPerson()) return;
  if(!isSearch&&!isLocal&&hasCats&&!isEmby)$('catOuter').style.display='block';
  if(isEmby&&embyLibraries.length)$('catOuter').style.display='block';
}

// ── helpers ────────────────────────────────────────────────────
function rememberBrowseScroll(){_browseScrollY=window.scrollY||document.documentElement.scrollTop||0;}
function restoreBrowseScroll(){requestAnimationFrame(()=>window.scrollTo({top:_browseScrollY,behavior:'auto'}));}
function showBrowse(){$('browseView').style.display='block';$('detailView').style.display='none';restoreBrowseScroll();}
function showDetail(){rememberBrowseScroll();$('detailView').style.display='block';$('browseView').style.display='none';$('catOuter').style.display='none';window.scrollTo({top:0,behavior:'auto'});}
function renderPager(cur,total,fnName){
  if(!total||total<=1){$('moreWrap').style.display='none';$('moreWrap').innerHTML='';return;}
  $('moreWrap').style.display='block';
  $('moreWrap').innerHTML=`<div style="display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap">
    <button class="more-btn" id="pagerPrevBtn" ${cur<=1?'disabled':''}>上一页</button>
    <span class="sec-count">第 ${cur} / ${total} 页</span>
    <button class="more-btn" id="pagerNextBtn" ${cur>=total?'disabled':''}>下一页</button>
  </div>`;
  const fn=window[fnName];
  if(typeof fn==='function'){
    const prev=$('pagerPrevBtn'), next=$('pagerNextBtn');
    if(prev && cur>1) prev.onclick=()=>fn(cur-1);
    if(next && cur<total) next.onclick=()=>fn(cur+1);
  }
}

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))&0xffffffff;return Math.abs(h);}

function skelHtml(n){
  return Array(n).fill(0).map(()=>`<div class="sk-card"><div class="sk-thumb sk"></div><div class="sk-line sk w70"></div><div class="sk-line sk w45"></div></div>`).join('');
}
function emptyHtml(icon,h,p){
  return `<div class="empty"><span class="empty-icon">${icon}</span><div class="empty-h">${h}</div>${p?`<p class="empty-p">${esc(p)}</p>`:''}</div>`;
}
function secHdHtml(title,count){
  return `<div class="sec-hd"><span class="sec-title">${esc(title)}</span>${count?`<span class="sec-count">${esc(count)}</span>`:''}</div>`;
}

init();
</script>
